openapi: 3.1.0
info:
  title: Travel Calendar API
  description: |
    REST API for the Travel Calendar application.

    This API manages trips, trip items (flights, hotels, etc.), and documents.
  version: 1.0.0
  contact:
    name: Travel Calendar
  license:
    name: MIT
    identifier: MIT
  x-mcp:
    name: travel-calendar
    version: "1.0.0"
    instructions: |
      Travel Calendar MCP Server. Use these tools to manage trips, items, documents, location queries, and Google Calendar integration.

      Key tools:
      - get_trips: List and filter trips by upcoming/past/purpose
      - get_trip: Get detailed trip info including items and locations
      - create_trip: Create a new trip with optional default location
      - search_trips: Full-text search across trips
      - add_item: Add flights, hotels, trains, drives, or events to a trip
      - get_location_on_date: Find where the user will be on a specific date
      - get_location_range: Get location timeline for a date range
      - list_calendars: List available Google Calendars (requires OAuth)
      - get_calendar_conflicts: Detect conflicts between calendar events and trip locations
      - suggest_trips_from_calendar: Analyze calendar events to suggest potential trips
      - merge_trips: Merge two trips into one, combining all items
      - move_item: Move an item to a different trip

      All dates use YYYY-MM-DD format. IDs are UUIDs.
    resources: []

servers:
  - url: http://localhost:3000
    description: Local development server

# No authentication required for local development
security: []

tags:
  - name: Health
    description: Service health checks
  - name: Trips
    description: Trip management
  - name: Items
    description: Trip item management (flights, hotels, etc.)
  - name: Documents
    description: Document management
  - name: Config
    description: User configuration (base locations, preferences)
  - name: Location
    description: Location queries (where is the user on a given date)
  - name: Calendar
    description: Google Calendar integration and OAuth

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: Returns the health status of the service
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: backend
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips:
    get:
      operationId: listTrips
      tags: [Trips]
      summary: List trips
      description: Returns a list of trips, optionally filtered
      x-mcp:
        tool: get_trips
        description: "Get a list of trips. Filter by upcoming (future trips), past (completed trips), or purpose (business, vacation, conference, family, other)."
      parameters:
        - name: upcoming
          in: query
          description: Filter to upcoming trips only
          schema:
            type: boolean
        - name: past
          in: query
          description: Filter to past trips only
          schema:
            type: boolean
        - name: purpose
          in: query
          description: Filter by trip purpose
          schema:
            $ref: '#/components/schemas/TripPurpose'
      responses:
        '200':
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTrip
      tags: [Trips]
      summary: Create a new trip
      x-mcp:
        tool: create_trip
        description: "Create a new trip. Required: name, purpose (business/vacation/conference/family/other). Optional: startDate, endDate (YYYY-MM-DD), status, notes, location (sets default location for all days)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
            example:
              name: "FOSDEM 2025"
              purpose: conference
              startDate: "2025-01-29"
              endDate: "2025-02-02"
              notes: "Annual open source conference in Brussels"
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips/search:
    get:
      operationId: searchTrips
      tags: [Trips]
      summary: Search trips
      description: Full-text search across trip names, notes, and items
      x-mcp:
        tool: search_trips
        description: "Search trips by text. Searches across trip names, notes, and item details. Returns matching trips."
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips/{tripId}:
    get:
      operationId: getTrip
      tags: [Trips]
      summary: Get a trip by ID
      x-mcp:
        tool: get_trip
        description: "Get detailed information about a specific trip including all its items (flights, hotels, etc.) and per-day locations."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateTrip
      tags: [Trips]
      summary: Update a trip
      x-mcp:
        tool: update_trip
        description: "Update an existing trip. All fields are optional: name, purpose, startDate, endDate, status, notes."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteTrip
      tags: [Trips]
      summary: Delete a trip
      x-mcp:
        tool: delete_trip
        description: "Delete a trip and all its items. This action cannot be undone."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '204':
          description: Trip deleted
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips/{sourceId}/merge/{targetId}:
    post:
      operationId: mergeTrips
      tags: [Trips]
      summary: Merge one trip into another
      description: |
        Merges the source trip into the target trip:
        - All items from source are moved to target
        - Target dates extended if source dates are outside range
        - Notes concatenated (target + source) if mergeNotes is true
        - Source trip deleted after merge if deleteSource is true
      x-mcp:
        tool: merge_trips
        description: "Merge one trip into another, combining all items. Source trip is deleted after merge."
        path_params_as_input: true
      parameters:
        - name: sourceId
          in: path
          required: true
          description: Source trip ID (to be merged and deleted)
          schema:
            type: string
            format: uuid
        - name: targetId
          in: path
          required: true
          description: Target trip ID (will receive items)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeTripsRequest'
      responses:
        '200':
          description: Trips merged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Invalid request (e.g., same trip for source and target)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Source or target trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trips/{tripId}/items:
    get:
      operationId: listTripItems
      tags: [Items]
      summary: List items for a trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createTripItem
      tags: [Items]
      summary: Add an item to a trip
      x-mcp:
        tool: add_item
        description: "Add an item to a trip. Type must be: flight, hotel, train, drive, or event. Fields vary by type - flights need from/to/carrier, hotels need name/location/checkIn/checkOut, etc."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
            examples:
              flight:
                summary: Flight item
                value:
                  type: flight
                  from: EWR
                  to: BRU
                  date: "2025-01-29"
                  time: "18:30"
                  carrier: United
                  flightNumber: UA123
                  confirmation: ABC123
              hotel:
                summary: Hotel item
                value:
                  type: hotel
                  name: Hotel Brussels
                  location: Brussels, Belgium
                  checkIn: "2025-01-29"
                  checkOut: "2025-02-02"
                  confirmation: HTL456
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/items/{itemId}:
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Delete an item
      x-mcp:
        tool: delete_item
        description: "Delete an item from a trip. This action cannot be undone."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Item deleted
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/items/{itemId}/move:
    post:
      operationId: moveItem
      tags: [Items]
      summary: Move an item to another trip
      description: |
        Moves an item to a different trip. Can either:
        - Move to an existing trip (provide targetTripId)
        - Create a new trip and move item to it (provide newTrip)
      x-mcp:
        tool: move_item
        description: "Move an item to a different trip, or create a new trip for the item."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveItemRequest'
      responses:
        '200':
          description: Item moved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveItemResponse'
        '400':
          description: Invalid request (must provide targetTripId or newTrip, or item already on target trip)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Item or target trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List documents
      x-mcp:
        tool: get_documents
        description: "Get a list of documents. Filter by tripId to get documents for a specific trip, or use unassociated=true to get documents not linked to any trip."
      parameters:
        - name: tripId
          in: query
          description: Filter by trip ID
          schema:
            type: string
            format: uuid
        - name: unassociated
          in: query
          description: Return only documents not associated with a trip
          schema:
            type: boolean
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Configuration endpoints
  /api/config/locations:
    get:
      operationId: getBaseLocations
      tags: [Config]
      summary: Get base locations
      description: Returns the user's configured base locations (home, work)
      x-mcp:
        tool: get_base_locations
        description: "Get the user's configured base locations (home and work addresses). These are used as defaults when the user is not traveling."
      responses:
        '200':
          description: Base locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLocations'
    put:
      operationId: setBaseLocations
      tags: [Config]
      summary: Set base locations
      description: Configure the user's base locations (home, work)
      x-mcp:
        tool: set_base_locations
        description: "Set the user's base locations. Both home and work are optional. Example: home='New York, USA', work='Manhattan, NYC'."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBaseLocationsRequest'
            example:
              home: "New York, USA"
              work: "Manhattan, NYC"
      responses:
        '200':
          description: Base locations updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseLocations'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Trip location endpoints
  /api/trips/{tripId}/locations:
    get:
      operationId: getTripLocations
      tags: [Trips]
      summary: Get locations for a trip
      description: Returns per-date location data for a trip
      x-mcp:
        tool: get_trip_locations
        description: "Get the per-day locations for a trip. Shows where the user will be on each day of the trip."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripDayLocation'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: setTripLocations
      tags: [Trips]
      summary: Set locations for a trip
      description: Set per-date locations for a trip. Replaces existing location data.
      x-mcp:
        tool: set_trip_locations
        description: "Set locations for a trip. Use defaultLocation for a single location for all days, or locations array for per-day overrides. Dates use YYYY-MM-DD format."
        path_params_as_input: true
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTripLocationsRequest'
            example:
              defaultLocation: "Brussels, Belgium"
              locations:
                - date: "2025-01-29"
                  locations: ["London, UK", "Brussels, Belgium"]
      responses:
        '200':
          description: Trip locations updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripDayLocation'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Location query endpoints
  /api/location/on/{date}:
    get:
      operationId: getLocationOnDate
      tags: [Location]
      summary: Get user location on a specific date
      description: |
        Returns where the user will be on a specific date.
        - If the date falls within a trip with explicit location, returns that location
        - If the date falls within a trip without explicit location, returns "Away"
        - If not within any trip, returns the user's home location
      x-mcp:
        tool: get_location_on_date
        description: "Find out where the user will be on a specific date (YYYY-MM-DD). Returns the location(s) and source (home, work, or trip name)."
        path_params_as_input: true
      parameters:
        - name: date
          in: path
          required: true
          description: Date to query (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Location on the specified date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationOnDateResponse'
        '400':
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/location/range:
    get:
      operationId: getLocationRange
      tags: [Location]
      summary: Get user locations for a date range
      description: |
        Returns a timeline of where the user will be across a date range.
        Consecutive days at the same location are grouped into segments.
      x-mcp:
        tool: get_location_range
        description: "Get a timeline of where the user will be across a date range. Returns location segments with dates and sources. Use from and to parameters (YYYY-MM-DD)."
      parameters:
        - name: from
          in: query
          required: true
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: End date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Location timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationRangeSegment'
        '400':
          description: Invalid date format or range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Google Calendar OAuth endpoints
  /api/auth/google:
    get:
      operationId: getGoogleAuthUrl
      tags: [Calendar]
      summary: Get Google OAuth URL
      description: Returns the URL to redirect the user for Google OAuth authorization
      parameters:
        - name: scopes
          in: query
          description: OAuth scopes to request (comma-separated). Defaults to calendar.readonly.
          schema:
            type: string
      responses:
        '200':
          description: OAuth URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlResponse'

  /api/auth/google/callback:
    get:
      operationId: handleGoogleCallback
      tags: [Calendar]
      summary: Handle Google OAuth callback
      description: Exchanges authorization code for tokens and stores credentials. Redirects to settings page.
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          description: State parameter for CSRF protection
          schema:
            type: string
        - name: error
          in: query
          description: Error from Google if authorization failed
          schema:
            type: string
      responses:
        '302':
          description: Redirect to settings page with success or error
        '400':
          description: Invalid callback parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/google/status:
    get:
      operationId: getGoogleAuthStatus
      tags: [Calendar]
      summary: Get Google authentication status
      description: Returns whether Google Calendar is connected and which scopes are authorized
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthStatus'

  /api/auth/google/disconnect:
    post:
      operationId: disconnectGoogle
      tags: [Calendar]
      summary: Disconnect Google Calendar
      description: Revokes access and deletes stored credentials
      responses:
        '204':
          description: Successfully disconnected
        '400':
          description: Not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Calendar management endpoints
  /api/calendars:
    get:
      operationId: listCalendars
      tags: [Calendar]
      summary: List available Google Calendars
      description: Returns all calendars from the user's Google account
      x-mcp:
        tool: list_calendars
        description: "List all available Google Calendars for the authenticated user."
      responses:
        '200':
          description: List of calendars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoogleCalendar'
        '401':
          description: Not authenticated with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendars/selected:
    get:
      operationId: getSelectedCalendars
      tags: [Calendar]
      summary: Get selected calendars
      description: Returns calendars the user has selected to monitor
      responses:
        '200':
          description: Selected calendars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCalendar'
    put:
      operationId: setSelectedCalendars
      tags: [Calendar]
      summary: Set selected calendars
      description: Updates which calendars to monitor for conflicts and suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSelectedCalendarsRequest'
      responses:
        '200':
          description: Updated selection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCalendar'
        '401':
          description: Not authenticated with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Calendar event and conflict endpoints
  /api/calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [Calendar]
      summary: List calendar events
      description: Returns events from selected calendars within date range
      parameters:
        - name: from
          in: query
          required: true
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: End date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: calendarId
          in: query
          description: Filter to specific calendar
          schema:
            type: string
      responses:
        '200':
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
        '401':
          description: Not authenticated with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar/conflicts:
    get:
      operationId: getCalendarConflicts
      tags: [Calendar]
      summary: Detect calendar conflicts with trips
      description: Returns events where the event location differs from the user's trip location on that date
      x-mcp:
        tool: get_calendar_conflicts
        description: "Detect calendar conflicts where events have locations that differ from the user's trip location on that date. Optionally filter by tripId or date range."
      parameters:
        - name: tripId
          in: query
          description: Check conflicts for specific trip
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Start date for range check (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End date for range check (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarConflict'
        '401':
          description: Not authenticated with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar/trip-suggestions:
    get:
      operationId: suggestTripsFromCalendar
      tags: [Calendar]
      summary: Suggest trips from calendar events
      description: Analyzes calendar events with locations to suggest potential trips
      x-mcp:
        tool: suggest_trips_from_calendar
        description: "Analyze calendar events with locations to suggest potential trips. Returns events that appear to be travel-related based on location patterns."
      parameters:
        - name: from
          in: query
          description: Start date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: End date (YYYY-MM-DD). Defaults to 90 days from now.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Trip suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSuggestion'
        '401':
          description: Not authenticated with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar/trip-suggestions/{suggestionId}/import:
    post:
      operationId: importTripSuggestion
      tags: [Calendar]
      summary: Import a trip suggestion
      description: Creates a trip from a calendar-based suggestion
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: Suggestion ID to import
          schema:
            type: string
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar/trip-suggestions/{suggestionId}/dismiss:
    post:
      operationId: dismissTripSuggestion
      tags: [Calendar]
      summary: Dismiss a trip suggestion
      description: Marks a trip suggestion as dismissed so it won't appear again
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: Suggestion ID to dismiss
          schema:
            type: string
      responses:
        '204':
          description: Suggestion dismissed
        '404':
          description: Suggestion not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar/trip-suggestions/{suggestionId}/merge/{tripId}:
    post:
      operationId: mergeTripSuggestion
      tags: [Calendar]
      summary: Merge a trip suggestion into an existing trip
      description: Adds items from the suggestion to an existing trip and extends dates if needed
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: Suggestion ID to merge
          schema:
            type: string
        - name: tripId
          in: path
          required: true
          description: Target trip ID to merge into
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip updated with merged items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Suggestion or trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar/processed-events:
    delete:
      operationId: resetProcessedEvents
      tags: [Calendar]
      summary: Reset all processed calendar events
      description: Clears the record of processed events, allowing dismissed suggestions to reappear
      responses:
        '204':
          description: Processed events reset

  # Trip calendar sync endpoint
  /api/trips/{tripId}/calendar-sync:
    post:
      operationId: syncTripToCalendar
      tags: [Calendar]
      summary: Sync trip to Google Calendar
      description: Creates or updates calendar events for trip and its items
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncTripRequest'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncTripResult'
        '401':
          description: Not authenticated with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      operationId: getTripCalendarLinks
      tags: [Calendar]
      summary: Get calendar links for a trip
      description: Returns existing calendar event links for this trip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Calendar links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarLink'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Trip ID
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      description: Item ID
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string

    TripPurpose:
      type: string
      enum:
        - business
        - vacation
        - conference
        - family
        - other

    TripStatus:
      type: string
      enum:
        - planning
        - confirmed
        - in_progress
        - completed
        - cancelled

    Trip:
      type: object
      required: [id, name, purpose, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        purpose:
          $ref: '#/components/schemas/TripPurpose'
        startDate:
          type: string
          format: date
          description: Trip start date (YYYY-MM-DD)
        endDate:
          type: string
          format: date
          description: Trip end date (YYYY-MM-DD)
        status:
          $ref: '#/components/schemas/TripStatus'
        notes:
          type: string
          maxLength: 10000
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          description: Trip items (only included when fetching a single trip)
        locations:
          type: array
          items:
            $ref: '#/components/schemas/TripDayLocation'
          description: Per-date locations for this trip (only included when fetching a single trip)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTripRequest:
      type: object
      required: [name, purpose]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        purpose:
          $ref: '#/components/schemas/TripPurpose'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TripStatus'
          default: planning
        notes:
          type: string
          maxLength: 10000
        location:
          type: string
          maxLength: 255
          description: Default location for all days of this trip (optional convenience)

    UpdateTripRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        purpose:
          $ref: '#/components/schemas/TripPurpose'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/TripStatus'
        notes:
          type: string
          maxLength: 10000

    ItemType:
      type: string
      enum:
        - flight
        - hotel
        - train
        - drive
        - event

    Item:
      type: object
      required: [id, tripId, type, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ItemType'
        # Common fields
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          description: Time in HH:MM format
        confirmation:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 10000
        # Transport fields (flight, train, drive)
        from:
          type: string
          maxLength: 100
          description: Origin location or airport code
        to:
          type: string
          maxLength: 100
          description: Destination location or airport code
        carrier:
          type: string
          maxLength: 100
          description: Airline or train operator
        flightNumber:
          type: string
          maxLength: 20
        # Hotel fields
        name:
          type: string
          maxLength: 255
          description: Hotel or event name
        location:
          type: string
          maxLength: 255
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        # Timestamps
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateItemRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ItemType'
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        confirmation:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 10000
        from:
          type: string
          maxLength: 100
        to:
          type: string
          maxLength: 100
        carrier:
          type: string
          maxLength: 100
        flightNumber:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        location:
          type: string
          maxLength: 255
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date

    Document:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
          description: Associated trip ID (null if unassociated)
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum:
            - confirmation
            - itinerary
            - receipt
            - visa
            - passport
            - insurance
            - other
        url:
          type: string
          format: uri
          description: URL or file path to the document
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message
        details:
          type: object
          additionalProperties: true
          description: Additional error details

    # Location-related schemas
    BaseLocations:
      type: object
      properties:
        home:
          type: string
          description: Home location (default "Home" if not configured)
        work:
          type: string
          description: Work location (optional)

    SetBaseLocationsRequest:
      type: object
      properties:
        home:
          type: string
          maxLength: 255
        work:
          type: string
          maxLength: 255

    TripDayLocation:
      type: object
      required: [date, locations]
      properties:
        date:
          type: string
          format: date
          description: The date (YYYY-MM-DD)
        locations:
          type: array
          items:
            type: string
          minItems: 1
          description: One or more locations for this date (multiple for travel days)

    SetTripLocationsRequest:
      type: object
      properties:
        defaultLocation:
          type: string
          maxLength: 255
          description: Default location for all dates not explicitly specified
        locations:
          type: array
          items:
            $ref: '#/components/schemas/TripDayLocation'
          description: Per-date location overrides

    LocationSourceType:
      type: string
      enum:
        - home
        - work
        - trip
      description: The source of the location (home, work, or a trip)

    LocationSource:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/LocationSourceType'
        tripId:
          type: string
          format: uuid
          description: Present when type is "trip"
        tripName:
          type: string
          description: Present when type is "trip"

    LocationOnDateResponse:
      type: object
      required: [date, locations, source]
      properties:
        date:
          type: string
          format: date
        locations:
          type: array
          items:
            type: string
          description: Location(s) on this date
        source:
          $ref: '#/components/schemas/LocationSource'

    LocationRangeSegment:
      type: object
      required: [startDate, endDate, locations, source]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        locations:
          type: array
          items:
            type: string
          description: Location(s) for this segment
        source:
          $ref: '#/components/schemas/LocationSource'

    # Calendar integration schemas
    OAuthUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: OAuth authorization URL to redirect the user to

    GoogleAuthStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
          description: Whether Google Calendar is connected
        email:
          type: string
          format: email
          description: Connected Google account email
        scopes:
          type: array
          items:
            type: string
          description: Authorized OAuth scopes
        expiresAt:
          type: string
          format: date-time
          description: When the access token expires

    GoogleCalendar:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Google Calendar ID
        name:
          type: string
          description: Calendar display name
        description:
          type: string
          description: Calendar description
        primary:
          type: boolean
          description: Whether this is the user's primary calendar
        backgroundColor:
          type: string
          description: Calendar color (hex code)
        accessRole:
          type: string
          enum: [owner, writer, reader, freeBusyReader]
          description: User's access level to this calendar

    UserCalendar:
      type: object
      required: [calendarId, name, enabled]
      properties:
        calendarId:
          type: string
          description: Google Calendar ID
        name:
          type: string
          description: Calendar display name
        enabled:
          type: boolean
          description: Whether this calendar is enabled for monitoring

    SetSelectedCalendarsRequest:
      type: object
      required: [calendarIds]
      properties:
        calendarIds:
          type: array
          items:
            type: string
          description: List of calendar IDs to enable for monitoring

    CalendarEvent:
      type: object
      required: [id, calendarId, summary, start, end]
      properties:
        id:
          type: string
          description: Google Calendar event ID
        calendarId:
          type: string
          description: Calendar this event belongs to
        summary:
          type: string
          description: Event title
        description:
          type: string
          description: Event description
        location:
          type: string
          description: Event location
        start:
          type: string
          format: date-time
          description: Event start time
        end:
          type: string
          format: date-time
          description: Event end time
        allDay:
          type: boolean
          description: Whether this is an all-day event
        htmlLink:
          type: string
          format: uri
          description: Link to view event in Google Calendar

    CalendarConflict:
      type: object
      required: [event, eventLocation, userLocation, date]
      properties:
        event:
          $ref: '#/components/schemas/CalendarEvent'
        eventLocation:
          type: string
          description: Location of the calendar event
        userLocation:
          type: string
          description: Where the user will actually be (from trip)
        date:
          type: string
          format: date
          description: Date of the conflict
        tripId:
          type: string
          format: uuid
          description: ID of the trip causing the conflict
        tripName:
          type: string
          description: Name of the trip causing the conflict

    TripSuggestion:
      type: object
      required: [id, name, startDate, endDate, location, sourceEvents]
      properties:
        id:
          type: string
          description: Unique ID for this suggestion (for import)
        name:
          type: string
          description: Suggested trip name
        startDate:
          type: string
          format: date
          description: Suggested start date
        endDate:
          type: string
          format: date
          description: Suggested end date
        location:
          type: string
          description: Suggested destination
        purpose:
          $ref: '#/components/schemas/TripPurpose'
        sourceEvents:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
          description: Calendar events that led to this suggestion
        source:
          type: string
          enum: [google, tripit]
          description: Source of the suggestion (google calendar or tripit)
        suggestedItems:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedItem'
          description: Items parsed from source events (flights, hotels, events)
        mergeCandidates:
          type: array
          items:
            $ref: '#/components/schemas/MergeCandidate'
          description: Existing trips that could be merged with this suggestion

    SuggestedItem:
      type: object
      required: [type, calendarEventId]
      properties:
        type:
          $ref: '#/components/schemas/ItemType'
        calendarEventId:
          type: string
          description: Source calendar event ID
        date:
          type: string
          format: date
        time:
          type: string
        from:
          type: string
        to:
          type: string
        carrier:
          type: string
        flightNumber:
          type: string
        name:
          type: string
        location:
          type: string
        confirmation:
          type: string
        notes:
          type: string

    MergeCandidate:
      type: object
      required: [tripId, tripName, matchReason]
      properties:
        tripId:
          type: string
          format: uuid
        tripName:
          type: string
        matchReason:
          type: string
          description: Why this trip matches (e.g., "Same location, overlapping dates")

    SyncTripRequest:
      type: object
      properties:
        targetCalendarId:
          type: string
          description: Which calendar to sync to (defaults to primary)
        createEvents:
          type: boolean
          default: true
          description: Whether to create new events
        includeFlights:
          type: boolean
          default: true
          description: Whether to include flight items
        includeHotels:
          type: boolean
          default: true
          description: Whether to include hotel items
        includeEvents:
          type: boolean
          default: true
          description: Whether to include event items

    SyncTripResult:
      type: object
      required: [eventsCreated, eventsUpdated]
      properties:
        eventsCreated:
          type: integer
          description: Number of new events created
        eventsUpdated:
          type: integer
          description: Number of existing events updated
        calendarLinks:
          type: array
          items:
            $ref: '#/components/schemas/CalendarLink'
          description: Links between trip items and calendar events

    CalendarLink:
      type: object
      required: [tripId, calendarId, eventId, syncedAt]
      properties:
        tripId:
          type: string
          format: uuid
          description: Trip ID
        itemId:
          type: string
          format: uuid
          description: Item ID (if linked to a specific item)
        calendarId:
          type: string
          description: Google Calendar ID
        eventId:
          type: string
          description: Google Calendar event ID
        syncedAt:
          type: string
          format: date-time
          description: When this link was last synced
        htmlLink:
          type: string
          format: uri
          description: Link to view event in Google Calendar

    # Trip organization schemas
    MergeTripsRequest:
      type: object
      properties:
        deleteSource:
          type: boolean
          default: true
          description: Whether to delete the source trip after merge
        mergeNotes:
          type: boolean
          default: true
          description: Whether to concatenate notes from both trips

    MoveItemRequest:
      type: object
      properties:
        targetTripId:
          type: string
          format: uuid
          description: ID of existing trip to move item to
        newTrip:
          $ref: '#/components/schemas/CreateTripRequest'
          description: Details for creating a new trip (if not moving to existing)

    MoveItemResponse:
      type: object
      required: [item]
      properties:
        item:
          $ref: '#/components/schemas/Item'
          description: The moved item with updated tripId
        trip:
          $ref: '#/components/schemas/Trip'
          description: The target trip (included if newTrip was created)
