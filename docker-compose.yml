# Travel Calendar - Docker Compose Configuration
#
# Usage:
#   docker compose build              # Build images
#   docker compose up                 # Start backend
#   docker compose up -d              # Start in background
#   docker compose logs -f backend    # Follow logs
#   docker compose down               # Stop all services
#
# Testing (via ./tc):
#   ./tc test backend                 # Run backend tests
#   ./tc test frontend                # Run frontend tests
#
# Services:
#   backend - REST API + Static Frontend + MCP on http://localhost:${PORT_1}
#   firebase-emulator - Firestore emulator + UI

services:
  # ===========================================
  # Firebase Emulator - Firestore for development
  # ===========================================
  firebase-emulator:
    image: mtlynch/firestore-emulator
    container_name: travel-firebase-emulator
    ports:
      - "${PORT_2:-4001}:8080"   # Firestore
    environment:
      - FIRESTORE_PROJECT_ID=travel-calendar-dev
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================
  # Backend - REST API + Static Frontend + MCP
  # ===========================================
  backend:
    build:
      context: .
      target: runtime
    container_name: travel-backend
    ports:
      - "${PORT_1:-4000}:3000"
    volumes:
      # Data persistence only
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/travel.db
      - PORT=3000
      - STORE_TYPE=${STORE_TYPE:-firestore}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-travel-calendar-dev}
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
    depends_on:
      firebase-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # Dev - Development container with all tools
  # Used for running tests via docker run
  # ===========================================
  dev:
    build:
      context: .
      target: dev
    container_name: travel-dev
    volumes:
      # Mount source for live testing
      - ./packages:/app/packages
      - ./tests:/app/tests
      - ./data:/app/data
      # Go module cache
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - DATABASE_PATH=/app/data/travel.db
    profiles:
      - dev

volumes:
  go-mod-cache:
    name: travel-go-mod-cache
  go-build-cache:
    name: travel-go-build-cache
