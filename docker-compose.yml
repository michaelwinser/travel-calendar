# Travel Calendar - Docker Compose Configuration
#
# Usage:
#   docker compose build              # Build images
#   docker compose up                 # Start backend
#   docker compose up -d              # Start in background
#   docker compose --profile mcp up   # Start with MCP server
#   docker compose logs -f backend    # Follow logs
#   docker compose down               # Stop all services
#
# Testing (via ./tc):
#   ./tc test backend                 # Run backend tests
#   ./tc test mcp                     # Run MCP tests
#   ./tc test frontend                # Run frontend tests
#
# Services:
#   backend - REST API + Static Frontend on http://localhost:3000
#   mcp     - MCP Server on http://localhost:3001 (profile: mcp)

services:
  # ===========================================
  # Backend - REST API + Static Frontend
  # ===========================================
  backend:
    build:
      context: .
      target: runtime
    container_name: travel-backend
    ports:
      - "3000:3000"
    volumes:
      # Data persistence only
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/travel.db
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # MCP Server - LLM Interface
  # ===========================================
  mcp:
    build:
      context: .
      target: runtime
    container_name: travel-mcp
    command: ["/app/bin/mcp"]
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=http://backend:3000
      - PORT=3001
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - mcp

  # ===========================================
  # Dev - Development container with all tools
  # Used for running tests via docker run
  # ===========================================
  dev:
    build:
      context: .
      target: dev
    container_name: travel-dev
    volumes:
      # Mount source for live testing
      - ./packages:/app/packages
      - ./data:/app/data
      # Go module cache
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - DATABASE_PATH=/app/data/travel.db
    profiles:
      - dev

volumes:
  go-mod-cache:
    name: travel-go-mod-cache
  go-build-cache:
    name: travel-go-build-cache
