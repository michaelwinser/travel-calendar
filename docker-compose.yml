# Travel Calendar - Docker Compose Configuration
#
# Usage:
#   docker compose build              # Build images
#   docker compose up                 # Start backend
#   docker compose up -d              # Start in background
#   docker compose logs -f backend    # Follow logs
#   docker compose down               # Stop all services
#
# Testing (via ./tc):
#   ./tc test backend                 # Run backend tests
#   ./tc test frontend                # Run frontend tests
#
# Services:
#   backend - REST API + Static Frontend + MCP on http://localhost:${PORT_1}

services:
  # ===========================================
  # Backend - REST API + Static Frontend + MCP
  # ===========================================
  backend:
    build:
      context: .
      target: runtime
    container_name: travel-backend
    ports:
      - "${PORT_1:-4000}:3000"
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # Dev - Development container with all tools
  # Used for running tests via docker run
  # ===========================================
  dev:
    build:
      context: .
      target: dev
    container_name: travel-dev
    volumes:
      # Mount source for live testing
      - ./packages:/app/packages
      - ./tests:/app/tests
      - ./data:/app/data
      # Go module cache
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
    profiles:
      - dev

volumes:
  backend-data:
    name: travel-backend-data
  go-mod-cache:
    name: travel-go-mod-cache
  go-build-cache:
    name: travel-go-build-cache
