# Travel Calendar - Development Environment
#
# Usage:
#   docker compose up                    # Start all services
#   docker compose up -d                 # Start in background
#   docker compose up backend frontend   # Start specific services
#   docker compose logs -f backend       # Follow logs
#   docker compose exec backend sh       # Shell into container
#   docker compose down                  # Stop all services
#   docker compose build --no-cache      # Rebuild images
#
# Services:
#   backend   - REST API (Hono + SQLite) on http://localhost:3000
#   frontend  - Web UI (SvelteKit) on http://localhost:5173
#   mcp       - MCP Server (HTTP) on http://localhost:3001
#
# First-time setup:
#   docker compose build
#   docker compose up

services:
  # ===========================================
  # Backend - REST API
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-backend
    command: pnpm --filter @travel-calendar/backend dev
    ports:
      - "3000:3000"
    volumes:
      # Source code - bind mount for hot reload
      - ./packages/backend/src:/app/packages/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      # Data persistence
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/travel.db
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================
  # Frontend - SvelteKit Web UI
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-frontend
    command: pnpm --filter @travel-calendar/frontend dev --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      # Source code - bind mount for hot reload
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/static:/app/packages/frontend/static
      - ./packages/shared/src:/app/packages/shared/src
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://localhost:3000
      # Vite needs this to detect file changes in Docker on macOS
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy

  # ===========================================
  # MCP Server - LLM Interface
  # ===========================================
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-mcp
    command: pnpm --filter @travel-calendar/mcp-server dev
    ports:
      - "3001:3001"
    volumes:
      - ./packages/mcp-server/src:/app/packages/mcp-server/src
      - ./packages/shared/src:/app/packages/shared/src
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:3000
      - PORT=3001
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - mcp  # Only start with: docker compose --profile mcp up

  # ===========================================
  # Sandbox - Claude Code Operations Container
  # ===========================================
  # This container provides a sandboxed environment for Claude Code to run
  # commands. All operations are isolated to the mounted project directory.
  #
  # Usage:
  #   ./tc sandbox start     # Start the sandbox container
  #   ./tc exec <command>    # Run command in sandbox
  #   ./tc sandbox shell     # Interactive shell in sandbox
  #
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-sandbox
    command: sleep infinity
    working_dir: /app
    volumes:
      # Mount entire project for full access
      - .:/app
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/travel.db
      - TRAVEL_API_URL=http://backend:3000
    profiles:
      - sandbox  # Start with: docker compose --profile sandbox up -d

  # ===========================================
  # Test Runner (on-demand)
  # ===========================================
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-test
    command: pnpm test
    volumes:
      - ./packages:/app/packages
      - ./tests:/app/tests
    environment:
      - NODE_ENV=test
      - TRAVEL_API_URL=http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - test  # Only start with: docker compose --profile test up
