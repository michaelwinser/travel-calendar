name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install appbase CLI
        run: go install github.com/michaelwinser/appbase/cmd/appbase@latest

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./internal/... ./gazetteer/... .

      - name: Build
        run: go build -o travel .

      - name: Go tests
        run: go test -v -count=1 ./...

      - name: Lint API (codegen drift)
        run: appbase lint-api 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Frontend type check
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Frontend build
        working-directory: frontend
        run: pnpm build

      - name: E2E smoke test
        run: tests/e2e/smoke-test.sh

      - name: E2E trip scenario
        run: tests/e2e/scenario-trips.sh
