name: travel-calendar
port: 3001

store:
  type: sqlite
  path: data/app.db

environments:
  local:
    url: http://localhost:3001
    auth:
      client_id: ${secret:google-client-id}
      client_secret: ${secret:google-client-secret}

  production:
    url: https://travel-calendar.run.app
    store:
      type: firestore
      gcp_project: xwind-travel-calendar
    auth:
      client_id: ${secret:google-client-id}
      client_secret: ${secret:google-client-secret}
