<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Trip</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="trips.html" class="text-gray-500 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </a>
      <h1 class="font-semibold text-lg flex-1">New Trip</h1>
      <button class="px-4 py-1.5 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded">
        Save Trip
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">
    <form class="space-y-6">
      <!-- Basic Info -->
      <div class="bg-white rounded-lg shadow-sm border p-4">
        <h2 class="font-medium text-gray-900 mb-4">Trip Details</h2>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Trip Name</label>
            <input type="text" placeholder="e.g., FOSDEM 2025, Summer Vacation"
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
              <input type="date" value="2025-01-29"
                     class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
              <input type="date" value="2025-02-02"
                     class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
            <div class="flex flex-wrap gap-2">
              <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50">
                <input type="radio" name="type" value="conference" class="sr-only" checked>
                <span class="w-3 h-3 rounded-full bg-orange-300"></span>
                <span class="text-sm">Conference</span>
              </label>
              <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:border-yellow-500 has-[:checked]:bg-yellow-50">
                <input type="radio" name="type" value="work" class="sr-only">
                <span class="w-3 h-3 rounded-full bg-yellow-300"></span>
                <span class="text-sm">Work</span>
              </label>
              <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                <input type="radio" name="type" value="vacation" class="sr-only">
                <span class="w-3 h-3 rounded-full bg-blue-300"></span>
                <span class="text-sm">Vacation</span>
              </label>
              <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:border-green-500 has-[:checked]:bg-green-50">
                <input type="radio" name="type" value="family" class="sr-only">
                <span class="w-3 h-3 rounded-full bg-green-300"></span>
                <span class="text-sm">Family</span>
              </label>
              <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50 has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50">
                <input type="radio" name="type" value="personal" class="sr-only">
                <span class="w-3 h-3 rounded-full bg-purple-300"></span>
                <span class="text-sm">Personal</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea rows="2" placeholder="What's this trip about?"
                      class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>
      </div>

      <!-- Items Section -->
      <div class="bg-white rounded-lg shadow-sm border p-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-medium text-gray-900">Items</h2>
          <div class="relative">
            <button type="button" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded flex items-center gap-1" onclick="document.getElementById('add-menu').classList.toggle('hidden')">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
              Add Item
            </button>
            <!-- Dropdown -->
            <div id="add-menu" class="hidden absolute right-0 mt-1 w-48 bg-white rounded-lg shadow-lg border py-1 z-10">
              <button type="button" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2">
                <span class="w-6 h-6 bg-blue-100 rounded flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                </span>
                Flight
              </button>
              <button type="button" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2">
                <span class="w-6 h-6 bg-emerald-100 rounded flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 text-emerald-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h2.23l2-2H14l2 2h2v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4z"/></svg>
                </span>
                Train
              </button>
              <button type="button" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2">
                <span class="w-6 h-6 bg-gray-100 rounded flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 text-gray-600" fill="currentColor" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z"/></svg>
                </span>
                Drive / Car Rental
              </button>
              <button type="button" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2">
                <span class="w-6 h-6 bg-purple-100 rounded flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 text-purple-600" fill="currentColor" viewBox="0 0 24 24"><path d="M7 14c1.66 0 3-1.34 3-3S8.66 8 7 8s-3 1.34-3 3 1.34 3 3 3zm12-3h-8v8H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg>
                </span>
                Hotel / Lodging
              </button>
              <button type="button" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2">
                <span class="w-6 h-6 bg-orange-100 rounded flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 text-orange-600" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                </span>
                Event / Activity
              </button>
              <hr class="my-1">
              <button type="button" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 flex items-center gap-2">
                <span class="w-6 h-6 bg-gray-100 rounded flex items-center justify-center">
                  <svg class="w-3.5 h-3.5 text-gray-600" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/></svg>
                </span>
                Document
              </button>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div class="text-center py-8 text-gray-500">
          <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          <p class="text-sm">No items yet</p>
          <p class="text-xs text-gray-400 mt-1">Add flights, hotels, events, and documents</p>
        </div>

        <!-- Or show existing items like this: -->
        <!--
        <div class="space-y-2">
          <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
            <span class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
              <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            </span>
            <div class="flex-1 min-w-0">
              <div class="font-medium text-sm">EWR → LHR</div>
              <div class="text-xs text-gray-500">Jan 29 · United UA123</div>
            </div>
            <button type="button" class="text-gray-400 hover:text-gray-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
              </svg>
            </button>
          </div>
        </div>
        -->
      </div>

    </form>
  </main>

  <!-- Add Flight Modal (example) -->
  <div id="flight-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
      <div class="flex items-center justify-between p-4 border-b">
        <h3 class="font-semibold">Add Flight</h3>
        <button type="button" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">From</label>
            <input type="text" placeholder="EWR" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">To</label>
            <input type="text" placeholder="LHR" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
            <input type="date" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
            <input type="time" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Airline</label>
            <input type="text" placeholder="United" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Flight #</label>
            <input type="text" placeholder="UA123" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmation #</label>
          <input type="text" placeholder="ABC123" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Attach Document</label>
          <div class="border-2 border-dashed rounded-lg p-4 text-center text-sm text-gray-500">
            Drop file here or <button type="button" class="text-blue-600 hover:underline">browse</button>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-2 p-4 border-t bg-gray-50 rounded-b-lg">
        <button type="button" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
        <button type="button" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded">Add Flight</button>
      </div>
    </div>
  </div>

</body>
</html>
